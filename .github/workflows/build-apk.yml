name: Build SONU VIP BOOSTER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android app
        run: |
          mkdir -p www
          HTML_FILE="./SONU_VIP_BOOSTER_V8_FINAL.html"
          if [ -z "$HTML_FILE" ]; then
            echo "HTML file not found"
            exit 1
          fi
          cp "$HTML_FILE" www/index.html
          cp IMG-20261019-WA0012.jpg www/
          echo '{"name":"sonu-vip-booster","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.sonu.vipbooster","appName":"SONU VIP BOOSTER","webDir":"www"}' > capacitor.config.json
          npx cap add android
          mkdir -p assets
          cp SONU_VIP_ICON.png assets/icon.png
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#090909'
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONU-VIP-BOOSTER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
